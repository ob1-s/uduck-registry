name: Sim Verification (MuJoCo)

# verified_simulation tier — recomputed on EVERY artifact-byte change, never inherited.
#
# Sandbox guarantees (non-negotiable):
#   - `pull_request` event ONLY (never pull_request_target): the job runs against
#     the merge commit in the uDuck repo's context, fork code cannot exfiltrate.
#   - NO secrets are available to this job. It needs none.
#   - Container pinned by digest; wheels pinned by sha256 (--require-hashes).
#   - MJCF is hash-gated before simulation (sim/mjcf-pins.json).
#   - MJCF URLs use the recorded resolved commit, never a branch/tag ref.
#   - The ONNX graph and fixed [1,61] -> [1,14] float32 interface are checked
#     before running.
#
# Fails closed: an unpinned MJCF (exit 2) blocks the tier rather than simulating
# against mutable bytes.

on:
  pull_request:
    paths:
      - 'registry/behaviors/**'
      - 'vendor/policies/**'
      - 'sim/**'
      - '.github/workflows/sim-verify.yml'

permissions: {}

jobs:
  static-onnx-check:
    name: ONNX static safety check
    outputs:
      has_candidates: ${{ steps.candidates.outputs.has_candidates }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: python:3.12-slim@sha256:09f7da3bc104798d0afb40bc08d23ab2da20a76130cec1f2ef170848f5d85217
    steps:
      - name: Checkout (merge commit, no credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install onnx (hash-pinned)
        run: pip install --no-cache-dir --require-hashes -r sim/requirements-hashes.txt

      - name: Find explicitly simulation-verified policies
        id: candidates
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/sim-policy-paths
          import json
          from pathlib import Path

          for descriptor in sorted(Path("registry/behaviors").glob("*.json")):
              behavior = json.loads(descriptor.read_text())
              if behavior.get("verification", {}).get("status") != "verified_simulation":
                  continue
              behavior_id = behavior.get("id")
              if behavior_id != descriptor.stem or not isinstance(behavior_id, str):
                  raise SystemExit(f"invalid simulation descriptor filename: {descriptor}")
              print(f"vendor/policies/{behavior_id}.onnx")
          PY
          if [[ -s /tmp/sim-policy-paths ]]; then
            echo "has_candidates=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_candidates=false" >> "$GITHUB_OUTPUT"
            echo "No verified_simulation entries; skipping ONNX and rollout checks."
          fi

      - name: Op allowlist + graph-size caps
        if: steps.candidates.outputs.has_candidates == 'true'
        run: |
          mapfile -t policies < /tmp/sim-policy-paths
          for policy in "${policies[@]}"; do
            test -f "$policy" || { echo "Missing policy bytes: $policy"; exit 1; }
          done
          python sim/check_onnx.py "${policies[@]}"

  sim-rollout:
    name: MuJoCo rollout (deterministic)
    needs: static-onnx-check
    if: needs.static-onnx-check.outputs.has_candidates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: python:3.12-slim@sha256:09f7da3bc104798d0afb40bc08d23ab2da20a76130cec1f2ef170848f5d85217
    steps:
      - name: Checkout (merge commit, no credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install sim deps (hash-pinned)
        run: pip install --no-cache-dir --require-hashes -r sim/requirements-hashes.txt

      # Fetch official MJCFs and hash-gate them. Network access ends here;
      # simulation itself runs on local, hash-verified bytes only.
      # Supports both sim/mjcf-pins.json (legacy string pins) and sim/mjcf-manifest.json
      # full closure (XML + assets/*.stl). Prefers manifest if present (required for
      # MuJoCo meshdir=assets). Hash-first, simulate-second — fails closed on mismatch.
      - name: Fetch & pin official MJCFs
        run: |
          mkdir -p sim/mjcf/assets
          python3 - <<'EOF'
          import hashlib, json, pathlib, re, sys, urllib.parse, urllib.request

          COMMIT_RE = re.compile(r"^[0-9a-f]{40}$")
          RAW_HOST = "raw.githubusercontent.com"
          SOURCE_REPO = "pollen-robotics/microduck_rl"

          def immutable_source(meta, name):
              repo = meta.get("source_repo")
              commit = meta.get("resolved_commit_sha")
              if repo != SOURCE_REPO:
                  raise SystemExit(f"unsupported MJCF source for {name}: {repo!r}")
              if not isinstance(commit, str) or not COMMIT_RE.fullmatch(commit):
                  raise SystemExit(f"MJCF {name} has no immutable resolved commit SHA")
              return repo, commit

          def safe_relative(value, label):
              path = pathlib.PurePosixPath(value)
              if path.is_absolute() or ".." in path.parts:
                  raise SystemExit(f"unsafe {label} path: {value!r}")
              return path

          # Helper to fetch with hash check
          def fetch_and_verify(url, dest_path, expected_sha, expected_size=None):
              req = urllib.request.Request(url, headers={"User-Agent": "uduck-registry-sim"})
              with urllib.request.urlopen(req, timeout=60) as response:
                  final = urllib.parse.urlparse(response.geturl())
                  if final.scheme != "https" or final.netloc != RAW_HOST:
                      raise SystemExit(f"unexpected redirect target for {dest_path}: {response.geturl()}")
                  data = response.read()
              actual = hashlib.sha256(data).hexdigest()
              if actual != expected_sha:
                  sys.exit(f"hash mismatch for {dest_path}: pinned {expected_sha}, got {actual}")
              if expected_size is not None and len(data) != expected_size:
                  sys.exit(f"size mismatch for {dest_path}: pinned {expected_size}, got {len(data)}")
              pathlib.Path(dest_path).parent.mkdir(parents=True, exist_ok=True)
              pathlib.Path(dest_path).write_bytes(data)
              print(f"pinned OK: {dest_path} {actual[:12]}… ({len(data)} B)")
              return actual

          # Prefer manifest (full closure) if present — it lists every asset.
          manifest_path = pathlib.Path("sim/mjcf-manifest.json")
          pins_path = pathlib.Path("sim/mjcf-pins.json")
          if manifest_path.exists():
              print("Using sim/mjcf-manifest.json (full closure)")
              manifest = json.loads(manifest_path.read_text())
              models = manifest.get("models", {})
              if not models:
                  print("manifest empty — sim tier fails closed")
                  sys.exit(1)
              for mjcf_name, meta in models.items():
                  source_repo, commit = immutable_source(meta, mjcf_name)
                  entries = meta.get("files")
                  if not isinstance(entries, list) or not entries:
                      raise SystemExit(f"MJCF manifest has no files for {mjcf_name}")
                  runtime_files = 0
                  for entry in meta.get("files", []):
                      repo_path = entry["repo_path"]
                      local_path = entry["local_path"]
                      sha = entry["sha256"]
                      size = entry.get("size_bytes")
                      safe_relative(repo_path, "repository")
                      safe_relative(local_path, "local")
                      # Provenance config is documented metadata, not a MuJoCo
                      # runtime dependency. Make the intentional omission visible.
                      if entry.get("kind") == "provenance_config":
                          print(f"recorded provenance (not runtime input): {repo_path}")
                          continue
                      runtime_files += 1
                      dest = pathlib.Path("sim/mjcf") / local_path
                      url = f"https://{RAW_HOST}/{source_repo}/{commit}/{repo_path}"
                      fetch_and_verify(url, str(dest), sha, size)
                  if runtime_files == 0:
                      raise SystemExit(f"MJCF manifest has no runtime files for {mjcf_name}")
                  print(f"closure OK: {mjcf_name} ({runtime_files} files)")
              sys.exit(0)

          # Fallback: pins file (supports both string sha and rich dict form)
          print("manifest not found, falling back to sim/mjcf-pins.json (XML only)")
          pins_data = json.loads(pins_path.read_text()) if pins_path.exists() else {}
          pins = pins_data.get("pins", {})
          if not pins:
              print("No MJCF pins configured — sim tier fails closed (exit 2 per verify_rollout).")
              sys.exit(1)
          for name, val in pins.items():
              if isinstance(val, dict):
                  # rich form
                  entry = val.get("entry", f"src/mjlab_microduck/robot/microduck/{name}")
                  files = val.get("files", {})
                  source_repo, commit = immutable_source(val, name)
                  # Use entry's sha
                  sha = files.get(entry, {}).get("sha256") or val.get("sha256") or ""
                  if not sha:
                      # try top-level entry file sha via any file matching name
                      for k, v in files.items():
                          if k.endswith(name):
                              sha = v.get("sha256", "")
                              break
                  safe_relative(entry, "repository")
                  url = f"https://{RAW_HOST}/{source_repo}/{commit}/{entry}"
                  dest = f"sim/mjcf/{name}"
                  if not sha:
                      sys.exit(f"cannot extract sha for rich pin {name}")
              else:
                  sys.exit(f"MJCF pin {name} must be a rich immutable pin, got {type(val)}")
              fetch_and_verify(url, dest, sha)
          EOF

      - name: Roll out selected policies
        run: python3 sim/run_rollouts.py --seed 0 --episode-length 10.0

      - name: Upload verification records
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sim-verification-records
          path: sim/records/*.json
          if-no-files-found: error
