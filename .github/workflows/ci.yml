name: uDuck CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # NOTE: pull_request_target is deliberately NOT used anywhere in this repo.
  # PR jobs run in the pull_request sandbox: no secrets, read-only token.

jobs:
  validate:
    name: Validate Registry & Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Byte-identical to `uduck validate`: schema, contract invariants, and the
      # tier gate (verified tiers require vendored bytes with matching sha256).
      - name: Validate Registry Schema, Invariants & Artifacts
        run: pnpm validate

      - name: Run Vitest Suite
        run: pnpm test

      - name: Compile Public Registry Index
        run: pnpm compile

      # Snapshot-diff: public/registry.json must be regenerated byte-identical.
      # A stale artifact means someone edited behaviors without recompiling.
      - name: Snapshot-diff registry.json
        run: |
          if ! git diff --exit-code public/registry.json; then
            echo "::error::public/registry.json is stale — run 'pnpm compile' and commit the result."
            exit 1
          fi

      - name: Build Web Application
        run: pnpm build

