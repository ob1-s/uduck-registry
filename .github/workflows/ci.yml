name: uDuck CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  evidence:
    name: Render current registry evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 ffmpeg
      - run: pip install -r simulation/requirements.txt
      - uses: actions/cache@v4
        with:
          path: .simcache
          key: sim-assets-${{ hashFiles('simulation/assets.lock.json') }}
      - name: Test runner
        run: PYTHONPATH=simulation python -m unittest discover -s simulation/tests
      - name: Render diagnostics (failed checks remain visible)
        env:
          MUJOCO_GL: egl
        run: |
          python - <<'PYRUN'
          import subprocess, sys
          from pathlib import Path
          for file in sorted(Path('registry/behaviors').glob('*.json')):
              result = subprocess.run([sys.executable, 'simulation/run_check.py', '--behavior', file.stem, '--out', 'sim-results', '--keep-media'])
              if result.returncode not in (0, 1):
                  raise SystemExit(result.returncode)
          PYRUN
      - uses: actions/upload-artifact@v4
        with:
          name: registry-evidence
          path: sim-results/
          retention-days: 14
  resolve-policies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r scripts/policy/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/policy/resolve.py prepare
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-policies
          path: .generated/policies/
          include-hidden-files: true
          if-no-files-found: ignore
  archive-evidence:
    needs: evidence
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: registry-evidence
          path: evidence
      - name: Archive diagnostics outside source history
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          zip -r registry-evidence.zip evidence
          gh release view "evidence-$COMMIT_SHA" >/dev/null 2>&1 || gh release create "evidence-$COMMIT_SHA" --target "$COMMIT_SHA" --title "Registry evidence $COMMIT_SHA" --notes "Diagnostics from trusted main code. Individual reports state measured checks and exact policy hashes." --latest=false
          gh release upload "evidence-$COMMIT_SHA" registry-evidence.zip --clobber
  validate:
    name: Validate Registry & Build
    needs: [evidence, resolve-policies]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate Registry
        run: pnpm validate

      - name: Run Vitest Suite
        run: pnpm test

      - name: Compile Public Registry Index
        run: pnpm compile

      - uses: actions/download-artifact@v4
        with:
          name: registry-evidence
          path: sim-results

      - uses: actions/download-artifact@v4
        with:
          pattern: resolved-policies
          path: .generated/policies
          merge-multiple: true

      - name: Publish matching diagnostics into this build
        run: python3 scripts/policy/collect_evidence.py sim-results

      - name: Build Web Application
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: "4.127.1"
          workingDirectory: ${{ runner.temp }}
          command: pages deploy ${{ github.workspace }}/out --project-name=uduck-registry
